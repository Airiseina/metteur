[workspace]
resolver = "3"
members = ["modules/cli", "modules/daemon", "modules/proto", "modules/shared", "modules/web-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8"
base64 = "0.22.1"
bincode = "1.3.3"
chrono = "0.4.42"
chrono-tz = "0.10.4"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29"
dashmap = { version = "6.2.1", features = ["rayon", "serde"] }
directories = "6.0.0"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
extism = "1.30.0"
flate2 = "1.1.9"
fluent-uri = "0.4.1"
http = "1.5.0"
libc = "0.2"
lsp-types = "0.97.0"
mimalloc = "0.1.52"
nanorand = "0.8.0"
notify = "8.2.0"
parking_lot = "0.12.5"
pest = "2.8.8"
pest_derive = "2.8.8"
proptest = "1.11.0"
prost = "0.14.4"
rapidhash = "4.5.1"
ratatui = "0.30.2"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rayon = "1.12.0"
rcgen = "0.14.9"
regex = "1.13.1"
rmcp = { version = "3.1.4", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "blocking", "rustls"] }
rkyv = "0.8.18"
rocksdb = "0.25.0"
rustls = "0.23.43"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
smallvec = "1.15.2"
stringzilla = "5.1.2"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
toml = "1.1.4"
tonic = { version = "0.14.6", features = ["tls-ring", "tls-connect-info"] }
tonic-prost = "0.14.6"
tonic-web = "0.14"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
twox-hash = "2.1.3"
uuid = { version = "1.24.1", features = ["v4", "serde"] }
wat = "1.257.1"
x509-parser = "0.18.1"
zip = "8.6.0"
zip-extensions = "0.14.1"
zstd = "0.13.3"
windows-service = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

# Large dependencies (rocksdb, extism/wasmtime) produce very big rlibs; full
# debuginfo can exceed the platform page file during parallel builds.
[profile.dev]
debug = "line-tables-only"
