[workspace]
resolver = "3"
members = ["modules/cli", "modules/daemon", "modules/harness", "modules/proto", "modules/shared", "modules/web-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
directories = "6.0.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
extism = "1.30.0"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
globset = "0.4.20"
http = "1.5.0"
ignore = "0.4.33"
libc = "0.2.189"
mimalloc = "0.1.52"
notify = "8.2.0"
parking_lot = "0.12.5"
pest = "2.9.1"
pest_derive = "2.9.1"
proptest = "1.11.0"
prost = "0.14.4"
ratatui = "0.30.2"
rcgen = "0.14.10"
regex = "1.13.1"
rmcp = { version = "3.4.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rocksdb = "0.25.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "blocking", "rustls"] }
rustls = "0.23.45"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
thiserror = "2.0.20"
tiktoken-rs = "0.12.1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
toml = "1.1.6"
tonic = { version = "0.14.6", features = ["tls-ring", "tls-connect-info"] }
tonic-prost = "0.14.6"
tonic-web = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
twox-hash = "2.1.4"
uuid = { version = "1.26.1", features = ["v4", "v5", "serde"] }
wat = "1.259.0"
x509-parser = "0.18.1"
zip = "8.6.0"
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

# Large dependencies (rocksdb, extism/wasmtime) produce very big rlibs; full
# debuginfo can exceed the platform page file during parallel builds.
[profile.dev]
debug = "line-tables-only"
